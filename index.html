const blank=()=>({version:1,tasks:defaults,completed:{},xp:0,history:[],lastDate:'',streak:0,boosts:0,customRewards:[['🕯️','Rituel cozy : chandelle + série, sans ménage',80],['🎨','45 min de Procreate / dessin',120],['🧶','Une session crochet sans interruption',130],['🎮','Soirée gaming / loisir sans culpabilité',180],['💅','Self-care de reine du chaos',220]],redeemed:[],monthly:{}});
let s;try{s={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=blank()}if(!Array.isArray(s.tasks))s.tasks=defaults;if(!s.completed||typeof s.completed!=='object')s.completed={};if(!Array.isArray(s.customRewards))s.customRewards=blank().customRewards;for(const t of defaults){if(!s.tasks.some(x=>x.id===t.id))s.tasks.push(t)}
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},day=()=>new Date().getDay(),safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{alert('Sauvegarde locale impossible : exporte une copie de secours.')}},done=id=>!!s.completed[(s.tasks.find(t=>t.id===id)?.kind==='boss'?'boss:':today()+':')+id];let tab='today',undo=[],timer=null,seconds=0;

function nextQuip(){let i=Math.floor(Math.random()*quips.length);if(i===lastQuip)i=(i+1)%quips.length;lastQuip=i;return quips[i]}
function finish(id){
let t=s.tasks.find(t=>t.id===id);if(!t||done(id))return;
snapshot();s.completed[(t.kind==='boss'?'boss:':today()+':')+id]=true;
let award=t.points,notice='';
if(t.kind==='boss'){
 const isScott=id.startsWith('scott'),isMine=id.startsWith('mine'),isOrganize=id.startsWith('org');
 const group=isScott?'scott':isMine?'mine':'org';
 const members=s.tasks.filter(x=>x.kind==='boss'&&(group==='scott'?x.id.startsWith('scott'):group==='mine'?x.id.startsWith('mine'):x.id.startsWith('org')));
 if(members.length&&members.every(x=>done(x.id))&&!s.completed['bonus:'+group]){
  const bonus=group==='org'?125:200;
  s.completed['bonus:'+group]=true;award+=bonus;
  notice=group==='scott'?'👹 BOSS SCOTT TERRASSÉ! +200 XP BONUS! Les jouets demandent l’asile politique.':group==='mine'?'👑 BOSS CHAMBRE VAINCU! +200 XP BONUS! Ta chambre est redevenue un royaume.':'🗄️ BOSS ORGANISATION VAINCU! +125 XP BONUS! Les tiroirs ont enfin un gouvernement.';
 }
}
s.xp+=award;
s.history.unshift({at:new Date().toISOString(),text:'+'+award+' ✨ '+t.name});
s.history=s.history.slice(0,150);
if(s.lastDate!==today()){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let y=[yesterday.getFullYear(),String(yesterday.getMonth()+1).padStart(2,'0'),String(yesterday.getDate()).padStart(2,'0')].join('-');s.streak=s.lastDate===y?s.streak+1:1;s.lastDate=today()}
save();render();cheer(notice||'+'+award+' XP ✨ '+nextQuip());
}
function tasksFor(d){return s.tasks.filter(t=>t.kind!=='boss'&&t.days.includes(d))}function list(ts){return ts.map(t=>`<div class="task ${done(t.id)?'done':''}"><div class="emoji">${t.icon}</div><div class="grow"><b class="taskname">${safe(t.name)}</b><div class="tiny">⏱️ ${t.min} min · +${t.points} ✨</div></div><button data-finish="${safe(t.id)}" class="${done(t.id)?'mint':''}" ${done(t.id)?'disabled':''}>${done(t.id)?'✓':'Fait!'}</button></div>`).join('')}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===tab?'':'secondary');let v=$('view'),due=tasksFor(day()),finished=due.filter(t=>done(t.id)).length;
if(tab==='today'){v.innerHTML=`<div class="card hero"><div class="row space"><div><div class="muted">⚡ TON BUTIN DU JOUR</div><div style="font-size:2rem;font-weight:900">${s.xp} ✨</div></div><div class="pill">🔥 ${s.streak} jour(s)</div></div><div class="row space"><span>${finished}/${due.length} missions du jour</span><b>${due.length?Math.round(finished/due.length*100):100}%</b></div><div class="progress"><div class="fill" style="width:${due.length?finished/due.length*100:100}%"></div></div><p class="muted">Tu n’es pas une machine à laver. Choisis tes combats. 🖤</p></div><div class="card"><h2>🎯 Quêtes du jour — coche seulement ce que tu fais</h2>${list(due)}</div><div class="card"><h2>👹 BOSS FIGHTS — les derniers survivants</h2><p class="muted">Seulement les deux chambres à finir. Cuisine et salon : entretien régulier, sauf les rangements à réorganiser. Le sous-sol est officiellement en congé.</p>${[['scott','🚀 Chambre de Scott',200],['mine','🖤 Ta chambre',200],['org','🗄️ Armoires et tiroirs',125]].map(([group,name,bonus])=>{let ts=s.tasks.filter(t=>t.kind==='boss'&&(group==='scott'?t.id.startsWith('scott'):group==='mine'?t.id.startsWith('mine'):t.id.startsWith('org'))),n=ts.filter(t=>done(t.id)).length;return `<div style="border-top:1px solid #554163;padding-top:14px;margin-top:12px"><div class="row space"><b>${name}</b><span class="pill">${n}/${ts.length}</span></div><div class="progress" style="margin:9px 0"><div class="fill" style="width:${ts.length?n/ts.length*100:0}%"></div></div><p class="tiny">💰 ${bonus} XP BONUS en plus des XP de chaque étape, quand le boss est vaincu!</p>${list(ts.filter(t=>!done(t.id)))||'<p>🏆 BOSS VAINCU — récompense débloquée!</p>'}</div>`}).join('')}</div><div class="card"><h2>🎲 Roulette anti-procrastination</h2><p>Le cerveau dit NON? On le contourne avec une quête ridicule de 2 minutes.</p><button id="random">🎰 TIRE UNE QUÊTE</button><p id="random-result" style="font-weight:700"></p></div>`}

v.querySelector('#random')?.addEventListener('click',()=>{let a=['🗑️ Exorcise 5 déchets. Le démon des miettes tremble.','🧺 Téléporte 5 objets à leur vraie place.','✨ Essuie UNE surface. Oui, juste une, madame perfectionnisme.','👟 Les chaussures retournent dans leur royaume.','🍽️ Range 5 choses. Mission furtive, personne ne te voit.','🛋️ Redresse le salon comme si la reine allait visiter.'];$('random-result').textContent=a[Math.floor(Math.random()*a.length)]});
v.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{stop();seconds=Number(b.dataset.min)*60;updateClock()});
v.querySelector('#start')?.addEventListener('click',()=>{if(timer){stop()}else{if(seconds<=0)seconds=120;let end=Date.now()+seconds*1000;timer=setInterval(()=>{seconds=Math.max(0,Math.ceil((end-Date.now())/1000));updateClock();if(seconds<=0){stop();cheer('⏰ Terminé! Tu peux être fière! 💜')}},250)}updateStart()});
v.querySelector('#restart')?.addEventListener('click',()=>{stop();seconds=0;updateClock()});
v.querySelector('#boostDone')?.addEventListener('click',()=>{snapshot();s.xp+=5;s.boosts++;s.history.unshift({at:new Date().toISOString(),text:'+5 ✨ Mini-effort SOS'});save();render();cheer('⚡ TU AS BATTU LE BOSS DU DÉMARRAGE!')});
v.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>{let r=s.customRewards[+b.dataset.redeem];if(!r||s.xp<r[2])return;if(confirm('Utiliser '+r[2]+' ✨ pour « '+r[1]+' »?')){snapshot();s.xp-=r[2];s.history.unshift({at:new Date().toISOString(),text:'🎁 '+r[1]+' (−'+r[2]+' ✨)'});save();render();cheer('🎁 ACHAT VALIDÉ, MAJESTÉ!')}});
v.querySelector('#addReward')?.addEventListener('click',()=>{let n=$('rewardName').value.trim(),c=Number($('rewardCost').value);if(!n||!Number.isInteger(c)||c<1||c>9999)return alert('Entre un nom et un coût valide.');snapshot();s.customRewards.push(['🎁',n,c]);save();render()});
v.querySelector('#addTask')?.addEventListener('click',()=>{let n=$('taskName').value.trim(),m=Number($('taskMinutes').value);if(!n||!Number.isInteger(m)||m<1||m>180)return alert('Entre un nom et une durée valide.');snapshot();s.tasks.push({id:'custom-'+Date.now(),icon:'💫',name:n,min:m,points:Math.max(5,Math.min(30,m*2)),days:[0,1,2,3,4,5,6],kind:'custom'});save();render()});
v.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette tâche?')){snapshot();s.tasks=s.tasks.filter(t=>t.id!==b.dataset.remove);save();render()}});
v.querySelector('#export')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='maison-nocturne-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)});
v.querySelector('#undo')?.addEventListener('click',()=>{if(!undo.length)return alert('Rien à annuler depuis cette ouverture.');s=JSON.parse(undo.pop());save();render()});
v.querySelector('#import')?.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.tasks)||!d.completed||!Number.isFinite(d.xp)||d.xp<0)throw Error('Format non reconnu');if(confirm('Remplacer les données actuelles par cette sauvegarde?')){snapshot();s={...blank(),...d,tasks:d.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&Array.isArray(t.days)&&Number.isFinite(t.points)).slice(0,200),history:Array.isArray(d.history)?d.history.slice(0,150):[]};save();render();alert('Sauvegarde restaurée!')}}catch(e){alert('Impossible de restaurer : '+e.message)}});
v.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Effacer tous tes points et tes tâches personnalisées? Exporte une sauvegarde avant.')){snapshot();s=blank();save();render()}});
}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function updateClock(){let c=$('clock');if(c)c.textContent=fmt(seconds)}function stop(){if(timer)clearInterval(timer);timer=null;updateStart()}function updateStart(){let b=$('start');if(b)b.textContent=timer?'⏸ Pause':'▶️ Démarrer'}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(tab==='boost')stop();tab=b.dataset.tab;render()});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
